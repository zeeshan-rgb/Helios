# Copy this file to  config/secrets.toml  (gitignored) and fill in your tokens/keys.
# Anything here is merged over settings.toml when Helios loads.
# The CLI installer (`python setup.py`) writes these for you; editing by hand is optional.

# --- Brain: Anthropic API-key path (ONLY if you chose "Claude API key" instead of login) ---
[anthropic]
# api_key = "sk-ant-..."

# --- Lite-brain + cloud-voice providers (all OpenAI-compatible). Set the one(s) you use. ---
[openai]
# api_key = "sk-..."
# base_url = "https://api.openai.com/v1"

[groq]
# api_key = "gsk_..."
# base_url = "https://api.groq.com/openai/v1"

[openrouter]
# api_key = "sk-or-..."
# base_url = "https://openrouter.ai/api/v1"

[gemini]
# api_key = "..."
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

# Ollama is local and usually keyless; base_url defaults to http://127.0.0.1:11434/v1
[ollama]
# base_url = "http://127.0.0.1:11434/v1"

# --- Optional web-search backend for the lite brain (else it asks you for a URL) ---
[search]
# backend = "tavily"   # tavily | brave | serper
# api_key = "..."

[telegram]
# Text Helios from your phone. Steps:
#   1. In Telegram, message @BotFather -> /newbot -> follow prompts -> copy the bot token.
#   2. Message @userinfobot to get your numeric user id.
#   3. Paste below, save as config/secrets.toml, and restart Helios.
token = ""
# REQUIRED if you set a token: only these Telegram user ids may control Helios.
# An EMPTY list means deny-all (nobody is authorized) — set your id to enable the bridge.
allowed_ids = []          # e.g. [123456789]

# --- Personal startup extras (kept out of the committed defaults) ---
[startup]
# spotify_play = "spotify:playlist:XXXXXXXX"
