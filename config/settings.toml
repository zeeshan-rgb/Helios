# Helios configuration. Edit freely — Helios reads this fresh on each launch.

[paths]
# Obsidian vault that serves as Helios's living memory. Blank = ~/Documents/Obsidian Vaults/LocalAI
# (under YOUR home). `helios onboard` fills this in for you — keep it blank in the committed default.
vault = "D:/Helios/data/memory"   # moved off C: (2026-09-29); the old vault was copied, not deleted
# Default working directory for the brain's file/shell actions. Blank = your home directory.
workspace = ""
# Project manifests (one <name>.yaml per project; `helios projects add <folder>`). These are the
# ONLY folders Helios inspects/checks on its own. Blank = data/projects.
projects = "D:/Helios/data/projects"

[claude]
# Fallback model if the router is disabled.
model = "opus"
# Hard ceiling per turn (seconds) before Helios gives up on a brain turn.
turn_timeout = 600
# Cap on agentic tool-rounds per turn (--max-turns): a runaway-loop backstop, set generously so
# a long computer-use task never hits it in normal work.
max_turns = 80

[brain]
# Which engine runs the assistant:
#   "claude" — the full Claude Code brain (claude -p): computer-use, MCP tools, missions, memory,
#              and the permission hook. Auth = your Claude login OR an Anthropic API key (set
#              [anthropic].api_key in config/secrets.toml). Full power; the default.
#   "antigravity" — Google's official Antigravity CLI (`agy`), signed in with your Google account
#              (Google AI Pro entitlement; no API key). Helios keeps voice/memory/persona/safety;
#              agy executes (files, terminal, web, browser, subagents, Helios MCP tools). Every tool
#              call passes Helios's permission gate. See [antigravity] below. Sign in once: `agy`.
#   "gemini" — Google's Gemini CLI. NOTE: Google stopped serving personal Google-account (AI Pro/
#              free) sign-in on the Gemini CLI on 2026-06-18; kept for API-key/enterprise use.
#   "lite"   — a native OpenAI-compatible loop for non-Claude providers (openrouter/openai/gemini/
#              ollama/groq). A curated, permission-gated toolset (read/write files, run shell, open
#              app, web fetch/search, system health, memory, reminders). No computer-use/missions.
engine = "antigravity"
# For engine="lite": the provider + model. Keys/base_url live in config/secrets.toml [<provider>].
provider = "openai"     # openai | openrouter | gemini | ollama | groq
model = ""              # blank = a sensible default per provider (e.g. gpt-4o / gemini-3.8-flash)
tools_enabled = true    # let the lite brain call its curated tools (false = plain chat only)
max_steps = 8           # max tool-call rounds per lite turn

[antigravity]
# For engine="antigravity". The official agy binary; blank = find `agy` on PATH.
bin = "D:/Helios/tools/agy/bin/agy.exe"
model = ""              # live chat model slug (`agy models`); blank = agy's default (Gemini 3.8 Flash High)
effort = ""             # low | medium | high | max ; blank = agy default
# Background agents (routines, missions, side tasks) pick a model per router tier:
light = "gemini-3.8-flash-low"
medium = "gemini-3.8-flash-medium"
heavy = "gemini-3.1-pro-high"
digest_chars = 4000     # cap on the per-turn memory digest (it stays in the conversation = quota)
# Post-turn memory extraction costs one extra agy run per reply (~24k input tokens of agy's own
# system prompt). Off until the Phase 4 memory work adds a cheaper path.
memory_writeback = false

[computer]
# PC control (cua-driver, official trycua/cua release; installed to D: with telemetry off).
driver_bin = "D:/Helios/tools/cua/bin/cua-driver.exe"

[gemini]
# For engine="gemini". The CLI (npm @google/gemini-cli); blank = find `gemini` on PATH.
bin = "D:/Helios/tools/npm/gemini.cmd"
# Router tier -> Gemini model. Aliases resolve to the newest models; full names also work.
light = "flash-lite"
medium = "flash"
heavy = "pro"
model = "auto"          # used when [router].auto = false
include_dirs = []       # extra folders the file tools may touch (home + vault are always allowed)

[screen]
# Opt-in screen awareness is toggled at runtime ("watch my screen"). How often to glance:
interval_min = 10

[agents]
# Background work (routines, jobs, screen checks) runs as separate "side agent" Claude
# processes so the orchestrator (your live chat) is never blocked.
max_parallel = 3       # max side agents running at once
# Only one agent drives the mouse/keyboard at a time (the "screen lock"):
screen_wait_sec = 20   # how long an agent waits for the screen before reporting it busy
idle_ms = 1500         # a side agent treats you as "active" within this many ms of your last
                       # keyboard/mouse input, and defers its screen actions until you're idle
# Multi-agent "missions": one supervisor decomposes a goal and spawns a team of worker
# agents that collaborate on a shared blackboard. Caps keep it from running away:
max_concurrent = 5         # global cap on mission agents executing at once (across all missions)
max_depth = 3              # how deep spawning can nest (supervisor=0, its workers=1, ...)
max_mission_agents = 8     # max total agents a single mission may spawn
mission_timeout_sec = 1800 # hard ceiling for a whole mission (the supervisor process)

[proactive]
# Background nudges (battery/disk/downloads). Each alert fires at most once every ~6h.
enabled = true
quiet_start = 22       # no alerts from this hour...
quiet_end = 8          # ...until this hour
battery_pct = 20       # warn at/below this % when unplugged
disk_gb = 10           # warn when C: free space drops below this (GB)
downloads_count = 60   # suggest tidying when Downloads has more than this many items

[router]
# Automatically pick a Claude model per task (cheap -> capable).
auto = true
light  = "haiku"     # quick chat, lookups, trivial edits
medium = "sonnet"    # normal GUI tasks, moderate coding
heavy  = "opus"      # complex / multi-step / ambiguous / risky reasoning
# When heuristics are unsure, ask the light model to triage the tier.
# Off by default: it adds a classification call (a few seconds) before the turn.
# Heuristics alone already route automatically with zero added latency.
triage = false
# Background memory extraction always uses the light tier.

[startup]
# Helios auto-starts at logon. With hidden=true it comes up COMPLETELY invisible — no orb, the
# dashboard hidden — and DORMANT: the mic only listens for the wake gesture (the "hey Helios"
# wake word is off until woken). The system-tray icon and the summon hotkey still work as a
# fallback. Waking (by gesture, tray, or hotkey) reveals the orb, opens the dashboard + the apps
# below, and switches voice to normal. Requires [voice].enabled (the daemon owns the mic).
hidden = true
wake_gesture = "double_clap"   # "double_clap" or "none" (none = wake only via tray/hotkey)
open_on_wake = ["spotify"]     # apps/URIs to launch on wake (the dashboard always opens too).
                               # "spotify" is only opened if Spotify is actually connected (the
                               # one-time OAuth via setup / tools/spotify_auth.py) — otherwise it's
                               # skipped, so a fresh install doesn't pop Spotify open on every wake.
clap_sensitivity = 0.15        # min loudness of EACH clap (0.06 very sensitive .. 0.35 needs a
                               # loud clap); one of the two must reach ~1.7x this. A clap must
                               # also be sharp (gone within 0.15s), so speech/music/TV don't count.
                               # Raise it if background noise still wakes Helios; lower it if your
                               # claps don't register (a foam windscreen makes claps quieter).
                               # (was 0.1 — too sensitive: background bumps woke Helios, 2026-09-30)
clap_max_gap = 1.0             # max seconds between the two claps (was 1.5 — too easy for two
                               # random noises to pair up)
# Spotify: by DEFAULT just open the app (no auto-play). Set spotify_play to a playlist/album/track
# (a Spotify URI like "spotify:playlist:XXXX" or an open.spotify.com link) to auto-start it on wake.
# the user's personal "play KB on wake" lives in config/secrets.toml [startup] (gitignored), so the
# committed default stays "don't auto-play".
spotify_play = ""

[orb]
# The desktop orb. `engine` picks the renderer (helios/orb_overlay.py dispatches, falling back
# down the chain if one fails to start):
#   webview — three.js + React neural network with UnrealBloom in a transparent WebView2 window.
#             The pretty one. CAVEAT: WebView2 transparency rides on GPU compositing — if Windows
#             drops it (battery saver, driver update, RDP) the orb renders as an OPAQUE BOX and
#             cannot detect that itself. If you see the box, switch to "layered".
#   layered — pure-Win32 per-pixel-alpha layered window (PIL/numpy renderer). GPU-independent
#             transparency, real glow. The reliable choice.
#   tk      — the original tkinter color-key overlay. No alpha/glow, but bulletproof.
# `style` applies to the webview engine only: bloom (post-processed glow) | glow (cheap shells).
# `size` = the orb window in px (both engines; the visible disc is ~2/3 of it).
engine = "webview"
style = "bloom"
size = 190

[voice]
# Voice stack (wake word -> speech-to-text -> brain -> Kokoro TTS), run by the standalone
# voice daemon (helios/voice/). All on-device, CPU, no cloud. Toggle the whole thing here.
enabled = true
# Pluggable engines. Local defaults need no keys; cloud engines read config/secrets.toml
# [openai]/[groq] (api_key). Cloud TTS/STT trade on-device privacy for quality/speed.
tts_engine = "kokoro"          # kokoro (local) | openai | groq
stt_engine = "faster-whisper"  # faster-whisper (local) | openai | groq
# How an utterance is captured. "realtimestt" = KoljaB/RealtimeSTT: WebRTC+Silero endpointing,
# the final transcription starts DURING your pause (text ready ~0.7s sooner at silence_ms 1500),
# and live text every ~0.3s from a small tiny.en model (2 CPU threads). It reuses Helios's mic and
# stt model; if it's missing or fails, Helios falls back to "builtin" on its own.
capture_engine = "realtimestt"   # realtimestt | builtin
rt_partial_model = "tiny.en"     # live-text model (tiny.en fastest; base.en more accurate, more CPU)
rt_partial_threads = 2           # CPU threads for live text (keep low so the PC stays responsive)
rt_partial_pause = 0.3           # seconds between live-text updates
# rt_early_ms = 500              # silence (ms) before the final transcription starts; default
                                 # silence_ms - 1000 (min 450). Lower = faster but more wasted work.
# Speaker verification: reject false wakes from other people/videos by matching a voiceprint.
# OPT-IN (default false): needs `pip install resemblyzer` (pulls PyTorch, ~500MB) + a one-time
# enrollment ("hey Helios, enroll speaker"). Turn on only after enrolling, or it will silently
# reject your own wakes until a voiceprint exists.
speaker_verify = false         # VOICE LOCK: act only on the enrolled owner's voice (commands, follow-
                               # ups, spoken permission answers). Enroll: press the talk hotkey and
                               # say "enroll my voice" — enrolling turns this on automatically.
speaker_verify_threshold = 0.70  # 0..1; higher = stricter (fewer imposters, but needs clearer voice)
# Cloud overrides (used only when the matching *_engine is openai/groq):
# tts_openai_model = "tts-1"        ; tts_openai_voice = "alloy"
# tts_groq_model   = "playai-tts"   ; tts_groq_voice   = "Fritz-PlayAI"
# stt_openai_model = "whisper-1"
# stt_groq_model   = "whisper-large-v3-turbo"
wake_word = "data/wake/hey_helios.onnx"   # custom model (train it: see HELIOS_SETUP.md). Or an
                           # openWakeWord pretrained name (alexa, hey_mycroft, ...), or "none".
                           # If the model is missing, voice still works via double-clap / the summon
                           # hotkey / push-to-talk, and `helios voice-check` says why.
wake_threshold = 0.5       # 0..1; higher = fewer false wakes, needs a clearer "hey Helios"
stt_model = "base.en"      # faster-whisper size: tiny.en (fastest) / base.en / small.en (best)
stt_prompt = "Helios, Kokoro, Composio, Spotify, enroll speaker, verify speaker"  # custom vocabulary bias for STT
tts_voice = "am_michael"   # Kokoro voice (chosen 2026-09-29). Others: bm_george, bm_lewis, bm_daniel,
                           # bm_fable, am_onyx, am_fenrir — samples in Helios\voice-samples
tts_speed = 1.15           # 0.5..2.0 speaking rate (raised from 1.0 on request: "reading slowly")
tts_pitch = 1.0            # voice character: <1 deeper (e.g. 0.9), >1 higher; speaking rate is kept
tts_reverb = 0.0           # 0..1 hall echo (e.g. 0.3 for a "divine" presence); 0 = dry
tts_lang = "en-us"         # en-us (American, matches am_* voices) or en-gb (bm_* voices)
# After Helios finishes speaking, keep the mic hot this long for a natural follow-up
# WITHOUT needing the wake word again (0 disables follow-ups).
followup_sec = 6
silence_ms = 1500          # trailing silence (ms) that ends an utterance — 1.5s so the user can pause
                           # mid-sentence without Helios cutting in (trade-off: ~0.7s slower to reply)
max_utterance_sec = 15     # hard cap on a single spoken command
speak_all = true          # also speak replies to dashboard/Telegram turns (not just voice)
live_transcript = true     # stream a live transcript to the dashboard HUD while you're speaking
barge_in = true            # let "hey Helios" interrupt Helios mid-sentence (mic stays open while
                           # speaking). Set false to make speaking uninterruptible if it self-triggers.
barge_threshold = 0.6      # stricter wake bar WHILE speaking (the open mic hears Helios itself);
                           # raise toward 0.8 if Helios's own voice false-triggers a barge
dictation_hotkey = "<ctrl>+<alt>+d"   # push-to-talk: transcribe speech into the focused field
talk_hotkey = "<ctrl>+<alt>+h"        # talk to Helios: same as saying "hey Helios" (chime, then speak)
listen_sec = 8             # after a wake word / clap / talk key: seconds to wait for you to start
muted = true

[server]
host = "127.0.0.1"
port = 8769

[hotkeys]
# pynput GlobalHotKeys syntax.
summon = "<ctrl>+<alt>+j"
panic  = "<ctrl>+<alt>+<backspace>"

[autonomy]
# Permission policy (most logic lives in helios/permissions.py classify()):
#   AUTONOMOUS: PC control (mouse/keyboard/screen/apps); reading files EXCEPT sensitive
#     ones; web search/fetch; read-only shell; safe system settings (audio/wifi/display);
#     creating/editing non-sensitive files; reading connected apps (Gmail/Calendar/Drive/GitHub).
#   ASK FIRST: modifying shell commands; touching sensitive files (.env/keys/system/browser/
#     financial); sending/posting (email, GitHub, social); installs; power (sleep/restart/
#     shutdown); money; camera/mic; permanent deletes of pre-existing files; unknown tools.
# Permission posture (set by setup's onboarding): "" = normal policy above; "blank" = confirm
# EVERYTHING not explicitly in `allow` below (the blank-slate onboarding choice).
mode = ""
# `allow` below = extra tools ALWAYS auto-approved (override). `always_ask` = always gated.
allow = ["mcp__computer__screenshot", "mcp__computer__screen_size", "mcp__computer__cursor_pos", "mcp__computer__list_windows", "mcp__computer__focus_window", "mcp__computer__launch_app", "mcp__computer__move", "mcp__computer__click", "mcp__computer__double_click", "mcp__computer__scroll", "mcp__computer__drag", "mcp__computer__type_text", "mcp__computer__press", "Glob", "LS", "WebSearch", "TodoWrite", "Skill", "ToolSearch"]
# NOTE: WebFetch is intentionally NOT here — it's the read-then-exfiltrate / SSRF vector, so
# it's gated to 'ask' (and hard-denied for private/loopback targets) in permissions.py.
# Always ask for these even if a broader rule would allow (substring match on tool name).
always_ask = []


[night_mode]
# Overnight maintenance: sync project state, run the projects' configured health checks, learn
# from the day's conversations, review learned rules/skills, summarize projects, and write a
# report to <vault>\Night Reports\. Needs Helios running (the PC awake) during the window; a
# missed night is reported with the reason. Never modifies Helios's own code.
enabled = true
start = "01:00"   # window start
end = "05:00"     # hard end: no task starts after this

[night_mode.schedule]
# task = earliest start time. Delete a line to turn that task off.
sync_projects = "01:00"
run_checks = "01:15"
research = "02:00"
find_leads = "02:40"            # worldwide paid-work leads with price ranges
analyze_conversations = "03:00"
extract_memories = "03:30"
update_rules_skills = "03:45"
project_summaries = "04:00"

[research]
# Night Mode researches these (plus each project manifest's research_topics), a few per night,
# least-recently researched first. Findings go to <vault>\Research Library\ — kept apart from
# memory. Runs in a locked-down mode: web search + reading public pages only.
enabled = true
topics = ["MCP", "computer use", "AI agents", "Gemini", "Antigravity", "Next.js", "React", "Three.js", "Polarion"]
include_project_topics = true
max_topics_per_run = 5
max_findings_per_topic = 4
recency_days = 14
timeout = 480   # seconds per topic (a topic usually takes 2-4 min)

[briefing]
# Morning briefing, built from last night's Night Mode report: project health, what I learned,
# research, what needs your approval — completed / observed / suggested / failed kept apart.
enabled = true
time = "08:00"         # prepared once a day at/after this time -> <vault>\Briefings\<date>.md
notify = true          # toast + dashboard note when it's ready
speak_on_wake = true   # read the short version aloud the first time you wake Helios after that

[mcp_public]
# Helios's PUBLIC MCP server (mcp/helios_public_server.py) for other MCP clients, e.g. the
# Antigravity IDE. Curated tools only; every call goes through Helios's permission gate
# (Approve/Deny prompt when needed) and is logged to logs\mcp_public.log. See docs\HELIOS_MCP.md.
enabled = true
read_only = false      # true = only the read tools (no save_memory / create_reminder / open_app / run_project_tests)
disabled_tools = []    # e.g. ["open_app", "run_project_tests"]

[security]
# Credential stores and secrets (SSH keys, password managers, browser credential stores, API
# credential files, cloud credentials, Helios's own secrets) are HARD-DENIED to every autonomous
# caller — the brain, background agents, Night Mode, MCP clients — even in YOLO mode.
# To allow one location on purpose, list its path (or a parent folder) here; it then goes through
# the normal policy, which still asks you first. Keep this empty unless you really need it.
allow_protected = []

[browser]
# Helios's HIDDEN browser (Playwright driving the installed Edge/Chrome headless, fresh profile —
# never your logins). Every request is checked: no internal addresses, even via redirects/DNS.
# Submitting forms / sending / buying needs your approval; it never types passwords or card numbers.
channels = ["msedge", "chrome"]   # tried in order (installed browsers — no extra download)
block_media = true               # skip images/video/fonts: faster, lighter (~650 MB while open)
idle_close_sec = 180             # close the browser after this long unused
max_tabs = 6
page_timeout_sec = 25

[polarion]
# Read-only access to Polarion through its REST API — Helios can search and read work items but has
# no way to create, change or delete anything. Tokens do NOT go here: run
#   helios polarion token local     /     helios polarion token server
# in your own terminal (hidden prompt) — they're saved to config/secrets.toml, which the AI can't read.
local_url = "http://localhost"     # this PC's Polarion (E:\polarion)
server_url = ""                    # the company server, e.g. "https://polarion.yourcompany.com"

[gmail]
# Helios reads your mail and DRAFTS replies to business contacts only; nothing is sent until you
# approve it (helios gmail send <n>, or saying "send it" and approving). Setup: helios gmail setup
# <client.json>, then helios gmail login (you sign in in your browser; the token goes to secrets.toml).
enabled = true
business_contacts = []       # e.g. ["client@acme.com", "@bigclient.com"] — or: helios gmail business add
check_every = "every 30m"    # schedule for the reply-draft check (a job: helios jobs)
query = "in:inbox is:unread newer_than:3d -category:promotions -category:social"
signature = ""               # e.g. "Best regards,\nZeeshan"
notify = true                # toast when reply drafts are ready
timeout = 180

[leads]
# Nightly, worldwide search for paid work matching your services, with a suggested price range per
# lead (from the rate card below) and a pitch draft. Helios NEVER contacts anyone — you send it.
# Leads live in <vault>\Leads\ and show up in the morning briefing; helios leads to manage them.
enabled = true
region = "worldwide"
services = ["web_dev", "app_dev", "web_enhancement", "digital_marketing", "logo_design", "pamphlet_design", "youtube_content"]
per_night = 3                # services searched per night (they rotate) — ~150-180k tokens each
max_leads_per_service = 3
currency = "USD"
timeout = 480                # seconds per service search
# Rate card: [min, max] per job size. small = one simple deliverable, medium = a typical project,
# large = a big or ongoing project. Edit freely — prices are computed from these, never by the AI.
[leads.rates.web_dev]
small = [300, 800]
medium = [800, 2500]
large = [2500, 8000]
[leads.rates.app_dev]
small = [1500, 4000]
medium = [4000, 12000]
large = [12000, 30000]
[leads.rates.web_enhancement]
small = [150, 500]
medium = [500, 1500]
large = [1500, 4000]
[leads.rates.digital_marketing]
small = [200, 600]
medium = [500, 1500]
large = [1500, 4000]
[leads.rates.logo_design]
small = [50, 150]
medium = [150, 400]
large = [400, 1200]
[leads.rates.pamphlet_design]
small = [30, 100]
medium = [100, 250]
large = [250, 600]
[leads.rates.youtube_content]
small = [50, 200]
medium = [200, 600]
large = [600, 2000]